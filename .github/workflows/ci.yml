name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v5

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            dpkg-dev \
            gir1.2-gtk-3.0 \
            libgtk-3-dev \
            python3-coverage \
            python3-gi \
            libglib2.0-dev \
            libjson-glib-dev \
            libjpeg-dev \
            libpixman-1-dev \
            libspice-protocol-dev \
            libssl-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            meson \
            ninja-build \
            pkg-config \
            python3-six \
            python3-pyparsing \
            shellcheck

      - name: Run Python tests with branch coverage
        run: |
          python3 -m coverage erase
          python3 -m coverage run --branch \
            --source=host/virt-manager-linux,guest/linux-gnome/guest \
            -m unittest discover -s host/virt-manager-linux/tests
          python3 -m coverage run --append --branch \
            --source=host/virt-manager-linux,guest/linux-gnome/guest \
            -m unittest discover -s guest/linux-gnome/tests
          python3 -m coverage report --omit='*/tests/*' --fail-under=80

      - name: Check Python and shell syntax
        run: |
          python3 -m py_compile \
            host/virt-manager-linux/*.py \
            host/virt-manager-linux/lib/*.py \
            guest/linux-gnome/guest/*.py \
            guest/linux-gnome/tests/*.py
          node --check \
            guest/linux-gnome/gnome-shell-extension/utm-dnd-target@utmapp.dev/extension.js
          find host/virt-manager-linux guest/linux-gnome \
            -type f -name '*.sh' -print0 | xargs -0 shellcheck

      - name: Verify spice-gtk patch applies to pinned source
        env:
          ARCHIVE: spice-gtk_0.42.orig.tar.xz
          SHA256: 9380117f1811ad1faa1812cb6602479b6290d4a0d8cc442d44427f7f6c0e7a58
          URL: http://archive.ubuntu.com/ubuntu/pool/universe/s/spice-gtk/spice-gtk_0.42.orig.tar.xz
        run: |
          mkdir ci-source
          curl --fail --location --proto '=http,https' --tlsv1.2 \
            --output "ci-source/$ARCHIVE" "$URL"
          printf '%s  %s\n' "$SHA256" "ci-source/$ARCHIVE" | sha256sum --check
          tar -xf "ci-source/$ARCHIVE" -C ci-source
          patch --dry-run -p1 -d ci-source/spice-gtk-0.42 \
            < host/virt-manager-linux/patches/spice-gtk-0.42-semantic-dnd.patch

      - name: Build and run semantic DnD state-machine tests
        run: |
          patch -p1 -d ci-source/spice-gtk-0.42 \
            < host/virt-manager-linux/patches/spice-gtk-0.42-semantic-dnd.patch
          mkdir ci-config
          : > ci-config/config.h
          cc -std=c11 -Wall -Wextra -Werror \
            -Ici-config -Ici-source/spice-gtk-0.42/src \
            ci-source/spice-gtk-0.42/tests/semantic-dnd.c \
            ci-source/spice-gtk-0.42/src/semantic-dnd.c \
            $(pkg-config --cflags --libs glib-2.0 json-glib-1.0) \
            -lm -o ci-config/test-semantic-dnd
          ci-config/test-semantic-dnd

      - name: Build and test patched spice-gtk integration
        run: |
          meson setup ci-build ci-source/spice-gtk-0.42 \
            -Dgtk=enabled \
            -Dwayland-protocols=disabled \
            -Dintrospection=disabled \
            -Dvapi=disabled \
            -Dusbredir=disabled \
            -Dsmartcard=disabled \
            -Dpolkit=disabled \
            -Dlibcap-ng=disabled \
            -Dwebdav=disabled \
            -Degl=disabled \
            -Dsasl=disabled \
            -Dopus=disabled \
            -Dlz4=disabled \
            -Dgtk_doc=disabled \
            -Dbuiltin-mjpeg=false
          meson compile -C ci-build
          meson test -C ci-build --print-errorlogs

      - name: Check patch whitespace
        run: git diff --check
